# รันบน Synology NAS (Container Manager) — ทำงานเบื้องหลังล้วน ไม่มีหน้าต่าง/ป็อปอัปบนจอใคร
# ลิงก์เว็บ = Cloudflare Quick Tunnel (สุ่ม ฟรี) · ไม่เปิดพอร์ตบน NAS เลย คนนอกเข้าได้ทาง tunnel อย่างเดียว
# คู่มือ: docs/nas-deploy.md
services:
  game:
    build:
      context: .
      dockerfile: Dockerfile.nas   # ติดตั้ง Python package ออฟไลน์ (DNS องค์กรบล็อก pypi)
    restart: always          # NAS รีบูต/โปรแกรมล่ม → ขึ้นเอง
    env_file: .env           # ค่าลับอยู่ในนี้ ไม่เข้า git
    environment:
      # ฐานข้อมูลทุกตัวอยู่ใน volume — ขาดข้อนี้ข้อมูลผู้เล่นหายทุกครั้งที่ build ใหม่
      GAME_DB_PATH: /app/data/game_data.db
      WEB_DB_PATH: /app/data/web.db
      LICENSE_DB_PATH: /app/data/licenses.db
      UPLOAD_DIR: /app/data/web_uploads
      BACKUP_DIR: /app/data/backups
      # ถาม cloudflared ว่าลิงก์สุ่มตอนนี้คืออะไร แล้วเขียนให้บอทแจก (license_server/tunnel_url.py)
      TUNNEL_METRICS_URL: http://tunnel:2000/quicktunnel
      # เซิร์ฟเกม ไม่ใช่เซิร์ฟแจกไลเซนส์ → ปิดช่อง mint/redeem คีย์ ไม่ให้โผล่ออกลิงก์สาธารณะ
      LICENSE_API: "0"
      # tunnel เป็น https เสมอ → คุกกี้ล็อกอินไปเฉพาะ https
      COOKIE_SECURE: "1"
    volumes:
      # ⚠️ ข้อมูลผู้เล่นอยู่ในนี้ — ห้ามลบโฟลเดอร์ data
      - ./data:/app/data
      # ตั้งค่าเกม/บอททั้งหมด (shop, rank, game_balance, guild ฯลฯ) — mount จากไฟล์โฮสต์ แก้แล้วบอทเห็น
      # ⚠️ ไฟล์ config.json ต้องมีอยู่ก่อนสตาร์ท ไม่งั้น Docker สร้างเป็นโฟลเดอร์ว่างแทน
      - ./config.json:/app/config.json
    # ไม่แย่ง NAS คนอื่น: เกมใช้จริง ~0.3 CPU / ~320 MB
    # จำกัดด้วยแรมอย่างเดียว — DS720+ เคอร์เนลไม่รองรับ cpus (CPU CFS) · แอปเบา ไม่กิน CPU อยู่แล้ว
    mem_limit: 512m
    # ใช้ DNS สาธารณะของ container เอง — ไม่พึ่ง DNS ภายในองค์กรของ NAS (resolve discord/cloudflare ได้เสมอ)
    dns:
      - 8.8.8.8
      - 1.1.1.1
    healthcheck:
      # ใช้ python แทน curl (Dockerfile.nas ไม่ลง curl เพื่อเลี่ยง apt)
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8790/',timeout=5).getcode()==200 else 1)"]
      interval: 60s
      timeout: 10s
      start_period: 40s

  tunnel:
    image: cloudflare/cloudflared:latest
    pull_policy: never       # ใช้ image ที่นำเข้าไว้ ไม่ดึงจากเน็ต (DNS องค์กรบล็อก Docker Hub)
    restart: always
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --url http://game:8790
    mem_limit: 128m
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      - game
