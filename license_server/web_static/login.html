<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n>ล็อกอิน — Fragment Rift</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="nav-wrap"><header id="navbar"></header></div>

<section class="block"><div class="container" style="max-width:560px">
  <h2 class="sec" data-i18n>🔑 ล็อกอินด้วยไอดี Discord</h2>
  <p class="sec-sub" data-i18n>ยืนยันตัวตนผ่านตัวเกมใน Discord — ไม่ต้องสมัครสมาชิก ไม่ต้องจำรหัสผ่าน</p>

  <div class="card" style="padding:26px">
    <div id="step1">
      <p data-i18n>กดปุ่มด้านล่างเพื่อรับโค้ดล็อกอิน (อายุ 5 นาที)</p>
      <button class="btn btn-primary" id="getCodeBtn" style="margin-top:14px" data-i18n>📟 ขอโค้ดล็อกอิน</button>
    </div>
    <div id="step2" class="hidden">
      <p data-i18n-html><b>ขั้นที่ 1:</b> คัดลอกคำสั่งนี้</p>
      <div class="big-code" id="codeBox"></div>
      <div class="btn-row">
        <button class="btn btn-primary" id="copyBtn" data-i18n>📋 คัดลอกคำสั่ง !weblogin</button>
        <button class="btn btn-ghost" id="checkBtn" data-i18n>✅ พิมพ์ในเกมแล้ว — เช็คสถานะ</button>
        <button class="btn btn-ghost" id="refreshBtn" data-i18n>🔄 ขอโค้ดใหม่</button>
      </div>
      <p style="margin-top:16px" data-i18n-html><b>ขั้นที่ 2:</b> ไปวางในห้องแชทเซิร์ฟเกมใน Discord แล้วส่ง</p>
      <p class="notice" id="waitNote" data-i18n>⏳ กำลังรอการยืนยันจากในเกม... (หน้านี้จะเข้าสู่ระบบให้อัตโนมัติ)</p>
    </div>
  </div>
</div></section>

<footer id="footer"></footer>

<script src="/i18n.js"></script>
<script src="/web.js"></script>
<script>
  renderChrome("");
  fillDiscordInvite();
  let code = "", timer = null, expireTimer = null;

  async function requestCode() {
    clearInterval(timer); clearTimeout(expireTimer);
    const d = await api("POST", "/api/web/login/code");
    code = d.code;
    document.getElementById("codeBox").textContent = code;
    document.getElementById("step1").classList.add("hidden");
    document.getElementById("step2").classList.remove("hidden");
    document.getElementById("copyBtn").textContent = tr("📋 คัดลอกคำสั่ง !weblogin");
    document.getElementById("waitNote").textContent = tr("⏳ กำลังรอการยืนยันจากในเกม... (หน้านี้จะเข้าสู่ระบบให้อัตโนมัติ)");
    timer = setInterval(poll, 2500);
    expireTimer = setTimeout(expired, 5 * 60 * 1000);
  }

  function expired() {
    clearInterval(timer); timer = null;
    document.getElementById("waitNote").textContent = tr("⌛ โค้ดหมดอายุแล้ว — กดปุ่ม 🔄 ขอโค้ดใหม่ได้เลย");
  }

  document.getElementById("getCodeBtn").addEventListener("click", requestCode);
  document.getElementById("refreshBtn").addEventListener("click", requestCode);
  document.getElementById("checkBtn").addEventListener("click", () => poll());

  document.getElementById("copyBtn").addEventListener("click", () => {
    navigator.clipboard.writeText(`!weblogin ${code}`);
    document.getElementById("copyBtn").textContent = tr("✅ คัดลอกแล้ว — ไปวางใน Discord ได้เลย");
  });

  // มือถือสลับแอปแล้วกลับมา → เช็คสถานะทันที (timer โดนพักตอนอยู่เบื้องหลัง)
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && code) poll();
  });

  async function poll() {
    if (!code) return;
    let res;
    try {
      res = await fetch(`/api/web/login/status?code=${code}`);
    } catch (e) {
      return;   // เน็ตสะดุดชั่วคราว (เช่นตอนสลับแอปบนมือถือ) — ไม่ใช่โค้ดหมดอายุ รอรอบถัดไป
    }
    if (res.status === 400) return expired();          // เซิร์ฟเวอร์ยืนยันว่าโค้ดหมดอายุ/ถูกใช้แล้วจริง
    const s = await res.json().catch(() => ({}));
    if (s.status === "ok") {
      clearInterval(timer); timer = null;
      location.href = "/me";
    }
  }
</script>
</body>
</html>
