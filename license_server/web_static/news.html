<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ข่าวสาร — PanTher Adventure</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="nav-wrap"><header id="navbar"></header></div>

<section class="block">
  <div class="container" id="listView">
    <h2 class="sec">📰 ข่าวสารทั้งหมด</h2>
    <p class="sec-sub">ประกาศ แพทช์โน้ต และอีเวนต์จากทีมงาน</p>
    <div class="btn-row" style="margin-bottom:24px" id="filters">
      <button class="btn btn-primary" data-cat="">ทั้งหมด</button>
      <button class="btn btn-ghost" data-cat="news">📢 ข่าว</button>
      <button class="btn btn-ghost" data-cat="patch">🛠️ แพทช์</button>
      <button class="btn btn-ghost" data-cat="event">🎪 อีเวนต์</button>
    </div>
    <div class="grid c3" id="newsList"><p>กำลังโหลด...</p></div>
  </div>

  <div class="container hidden" id="articleView">
    <p style="margin-bottom:14px"><a href="/news">← กลับหน้าข่าว</a></p>
    <div class="article">
      <span class="badge" id="artCat"></span>
      <h1 id="artTitle"></h1>
      <p class="meta" id="artDate"></p>
      <div id="artBody"></div>
    </div>
  </div>
</section>

<footer id="footer"></footer>

<script src="/web.js"></script>
<script>
  renderChrome("/news");
  fillDiscordInvite();
  const params = new URLSearchParams(location.search);

  async function showList(cat) {
    const box = document.getElementById("newsList");
    document.querySelectorAll("#filters .btn").forEach((b) => {
      b.className = "btn " + (b.dataset.cat === cat ? "btn-primary" : "btn-ghost");
    });
    try {
      const items = (await api("GET", "/api/web/news" + (cat ? `?category=${cat}` : ""))).news;
      box.innerHTML = items.length ? items.map((n) => `
        <a class="card" href="/news?id=${n.id}">
          <div class="pad">
            <span class="badge">${CATEGORY_LABEL[n.category] || n.category}</span>
            <h3>${esc(n.title)}</h3>
            <p>${esc(n.excerpt).slice(0, 110)}…</p>
            <p style="margin-top:8px;font-size:.85rem">${esc(n.created_at)}</p>
          </div>
        </a>`).join("") : "<p>ยังไม่มีข่าวในหมวดนี้</p>";
    } catch (e) { box.innerHTML = "<p>โหลดข่าวไม่สำเร็จ</p>"; }
  }

  async function showArticle(id) {
    document.getElementById("listView").classList.add("hidden");
    document.getElementById("articleView").classList.remove("hidden");
    try {
      const n = await api("GET", `/api/web/news/${id}`);
      document.title = `${n.title} — ข่าวสาร`;
      document.getElementById("artCat").textContent = CATEGORY_LABEL[n.category] || n.category;
      document.getElementById("artTitle").textContent = n.title;
      document.getElementById("artDate").textContent = `เผยแพร่ ${n.created_at}`;
      document.getElementById("artBody").innerHTML = md(n.body);
    } catch (e) {
      document.getElementById("artTitle").textContent = "ไม่พบข่าวนี้";
    }
  }

  if (params.get("id")) showArticle(params.get("id"));
  else {
    showList("");
    document.querySelectorAll("#filters .btn").forEach((b) =>
      b.addEventListener("click", () => showList(b.dataset.cat)));
  }
</script>
</body>
</html>
